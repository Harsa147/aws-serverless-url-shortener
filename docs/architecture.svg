<text x="205" y="225" text-anchor="middle" class="label">Web Browser</text><text x="205" y="250" text-anchor="middle" class="small">Desktop / Mobile</text>
<rect x="75" y="295" width="260" height="80" fill="#fff" stroke="#cbd3df" class="box"/>
<text x="205" y="330" text-anchor="middle" class="label">Create / Redirect</text><text x="205" y="355" text-anchor="middle" class="small">Short URLs</text>
