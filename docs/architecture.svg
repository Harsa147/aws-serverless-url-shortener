<text x="1030" y="740" class="head">Infrastructure as Code</text>
<text x="1030" y="780" class="label">Terraform manages:</text>
<text x="1030" y="808" class="small">S3 • CloudFront • API Gateway • Lambda • DynamoDB</text>
<text x="1030" y="835" class="small">IAM • CloudWatch • SNS • Remote state</text>
<text x="1030" y="865" class="small">Remote state: encrypted + versioned S3 + lockfile</text>
