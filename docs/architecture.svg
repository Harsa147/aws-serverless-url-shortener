<text x="775" y="515" text-anchor="middle" class="label">AWS Lambda</text><text x="775" y="542" text-anchor="middle" class="small">Python 3.14</text><text x="775" y="568" text-anchor="middle" class="small">Validate • Generate • Redirect</text>
<rect x="905" y="475" width="200" height="125" fill="#fff" stroke="#b9d9c4" class="box"/>
