<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<rect width="1600" height="950" fill="#ffffff"/>
<style>
.title{font:700 34px Arial;fill:#172033}.sub{font:400 18px Arial;fill:#526070}.head{font:700 22px Arial;fill:#173b72}.label{font:700 18px Arial;fill:#172033}.small{font:400 15px Arial;fill:#526070}.box{stroke-width:2;rx:16}.arrow{stroke:#526070;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526070"/></marker></defs>
<text x="55" y="55" class="title">LinkCraft – URL Shortener</text>
<text x="55" y="86" class="sub">Serverless AWS architecture • Terraform • GitHub Actions CI/CD • Monitoring &amp; alerting</text>
