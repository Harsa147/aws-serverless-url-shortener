<text x="597" y="230" text-anchor="middle" class="label">Amazon CloudFront</text><text x="597" y="257" text-anchor="middle" class="small">CDN • HTTPS</text><text x="597" y="282" text-anchor="middle" class="small">Origin Access Control</text>
<rect x="810" y="190" width="285" height="120" fill="#fff" stroke="#b8c8df" class="box"/>
<text x="952" y="230" text-anchor="middle" class="label">Amazon S3</text><text x="952" y="257" text-anchor="middle" class="small">Private frontend bucket</text><text x="952" y="282" text-anchor="middle" class="small">HTML • CSS • JavaScript</text>
<rect x="410" y="405" width="730" height="245" fill="#f5fbf7" stroke="#64b983" class="box"/>
