<rect x="305" y="775" width="240" height="75" fill="#fff" stroke="#d0c4ef" class="box"/><text x="425" y="808" text-anchor="middle" class="label">GitHub Actions</text><text x="425" y="832" text-anchor="middle" class="small">OIDC authentication</text>
<rect x="585" y="775" width="165" height="75" fill="#fff" stroke="#d0c4ef" class="box"/><text x="667" y="808" text-anchor="middle" class="label">Terraform</text><text x="667" y="832" text-anchor="middle" class="small">Plan / Apply</text>
<rect x="790" y="775" width="145" height="75" fill="#fff" stroke="#d0c4ef" class="box"/><text x="862" y="808" text-anchor="middle" class="label">Deploy</text><text x="862" y="832" text-anchor="middle" class="small">AWS resources</text>
