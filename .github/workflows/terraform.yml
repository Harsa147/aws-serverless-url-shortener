name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Lambda
        run: |
          cd "$GITHUB_WORKSPACE/lambda"
          zip -r lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::805046890944:role/github-actions-terraform
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Deploy Lambda Code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws lambda update-function-code --function-name url-shortener --zip-file fileb://lambda/lambda.zip

      - name: Run API Tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tests/test_api.py

      - name: Deploy Frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: aws s3 sync ../frontend "s3://$(terraform output -raw frontend_bucket_name)"

      - name: Invalidate CloudFront Cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: aws cloudfront create-invalidation --distribution-id "$(terraform output -raw cloudfront_distribution_id)" --paths "/*"